<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>E&amp;S FieldOps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{--navy:#12294b;--or:#e4571b;--bg:#f1f5fa;--card:#fff;--ink:#12263a;--mut:#5f7186;--line:#d6e0ec;--ok:#1b8a52;--bad:#c0392b;--soft:#fff3ec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1627;--card:#13233b;--ink:#e8eff8;--mut:#9fb2c7;--line:#28425f;--ok:#4cd08a;--bad:#ff8f84;--soft:#2a1e1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1627;--card:#13233b;--ink:#e8eff8;--mut:#9fb2c7;--line:#28425f;--ok:#4cd08a;--bad:#ff8f84;--soft:#2a1e1a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo{height:40px;width:auto;background:#fff;border-radius:10px;padding:4px 8px}
/* auth */
#auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.brand{background:linear-gradient(150deg,var(--navy) 55%,#1d4177);color:#fff;padding:40px;display:flex;flex-direction:column;justify-content:center;gap:22px;position:relative;overflow:hidden}
.brand:after{content:"";position:absolute;right:-90px;bottom:-90px;width:300px;height:300px;border-radius:50%;background:var(--or);opacity:.9}
.brand .logo{height:64px;align-self:flex-start;animation:rise .7s ease both}
.brand h2{font-size:34px;line-height:1.1;margin:0;font-weight:800;max-width:14ch}
.brand h2 em{font-style:normal;color:#ff9b66}
.brand p{margin:0;max-width:38ch;opacity:.85}
.brand ul{list-style:none;padding:0;margin:0;display:grid;gap:10px;position:relative;z-index:1}
.brand li{display:flex;gap:10px;align-items:center}
.brand li svg{color:#ff9b66}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.acc{display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:400px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{border:0;background:none;padding:10px;border-radius:9px;font:inherit;font-weight:700;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 4px #0002}
@media (prefers-color-scheme:dark){.seg button.on{color:var(--or)}}
/* app */
header{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;border-bottom:3px solid var(--or)}
header .sp{flex:1}
.chip{display:flex;align-items:center;gap:8px;font-size:13px}
.chip b{display:block;line-height:1.1}.chip small{opacity:.75}
.av{width:34px;height:34px;border-radius:50%;background:var(--or);display:grid;place-items:center;font-weight:800}
.ib{background:#ffffff1f;border:0;color:#fff;border-radius:10px;padding:8px;cursor:pointer;display:grid}
nav.nv{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.nv button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:10px;cursor:pointer;position:relative}
nav.nv button.on{color:var(--or);background:var(--soft)}
nav.nv .bd{position:absolute;top:2px;right:22%;background:var(--or);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
main{max-width:1020px;margin:0 auto;padding:16px 14px 100px}
@media (min-width:760px){nav.nv{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));bottom:auto;border:0;border-bottom:1px solid var(--line);padding:6px 16px;gap:6px;justify-content:center}nav.nv button{flex:none;flex-direction:row;font-size:14px;padding:8px 16px;gap:8px}main{padding-bottom:40px}}
@media (max-width:760px){#auth{grid-template-columns:1fr}.brand{padding:26px 22px 60px}.brand h2{font-size:26px}.brand ul{display:none}.chip span{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.st{border-radius:14px;padding:14px;color:#fff;background:linear-gradient(135deg,var(--navy),#27508f)}
.st:nth-child(2){background:linear-gradient(135deg,var(--or),#f08a4b)}.st:nth-child(3){background:linear-gradient(135deg,#0e7a6b,#2bb59f)}.st:nth-child(4){background:linear-gradient(135deg,#6b4bc0,#9b7fe6)}
.st b{display:block;font-size:30px;line-height:1.1}.st span{font-size:12px;opacity:.9}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:linear-gradient(var(--or),#f5a070);border-radius:6px 6px 2px 2px;min-height:3px;margin-bottom:4px}
.hero{background:linear-gradient(120deg,var(--navy),#24498a);color:#fff;border-radius:16px;padding:20px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.hero h2{margin:0;font-size:22px}.hero p{margin:2px 0 0;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
label.l{display:block;font-weight:600;font-size:13px;margin-bottom:4px}label.l i{color:var(--bad);font-style:normal}
input[type=text],input[type=password],input[type=date],textarea,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--or)}
textarea{min-height:76px;resize:vertical}
.btn{padding:11px 16px;border:0;border-radius:10px;background:var(--or);color:#fff;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.n{background:var(--navy)}.btn.s{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}.btn.d{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}.btn.w{width:100%}
@media (prefers-color-scheme:dark){.btn.s{color:#9ec3f5;border-color:#9ec3f5}}
.btn:disabled{opacity:.55;cursor:wait}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;grid-column:1/-1}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;min-height:170px;border:2px dashed var(--or);border-radius:14px;background:var(--soft);cursor:pointer;overflow:hidden;padding:12px;transition:background .15s}
.tile:hover{background:var(--card)}
.tile .ti{width:54px;height:54px;border-radius:50%;background:var(--or);color:#fff;display:grid;place-items:center}
.tile .ti svg{width:28px;height:28px}
.tile b{font-size:14px}.tile span{font-size:12px;color:var(--mut)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.tile.ok{border-style:solid;border-color:var(--ok)}.tile.ok img{display:block}
.tile.ok .ti,.tile.ok b,.tile.ok span{position:relative;z-index:1;color:#fff;text-shadow:0 1px 4px #000}
.tile.ok .ti{background:#0009}.tile.ok:before{content:"";position:absolute;inset:0;background:linear-gradient(#0000 40%,#000a);z-index:1}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rec{display:grid;grid-template-columns:1fr auto;gap:8px 14px}
.rec h3{margin:0 0 2px}.rec p{margin:1px 0;color:var(--mut);font-size:13px}
.th{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.th img{width:56px;height:44px;object-fit:cover;border-radius:6px}
.acts{display:flex;flex-direction:column;gap:6px;min-width:130px}
@media (max-width:520px){.rec{grid-template-columns:1fr}.acts{flex-direction:row;flex-wrap:wrap}}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--line);color:var(--ink)}
.tag.activo{background:#d6f3e3;color:#11613a}.tag.pendiente{background:#ffe8c9;color:#8a4b00}.tag.inactivo{background:#fbd9d5;color:#8c241a}
.msg{font-size:13px;margin:8px 0 0;color:var(--bad);min-height:18px}.msg.g{color:var(--ok)}
.gs{font-size:12px;color:var(--mut);margin-top:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:20;max-width:90%;box-shadow:0 4px 16px #0004}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.btn.r{background:var(--bad);color:#fff}
#mdl{position:fixed;inset:0;background:#000a;z-index:50;display:grid;place-items:center;padding:20px}
#mdl .card{max-width:380px;width:100%;margin:0}
.fb{margin-top:8px;padding:10px;border:1.5px dashed var(--or);border-radius:10px;font-size:12px;display:grid;gap:6px;color:var(--mut)}
a.btn{text-decoration:none}
.sec{display:flex;align-items:center;gap:8px;margin:20px 0 10px;font-size:16px;font-weight:800}
.sec:before{content:"";width:5px;height:20px;background:var(--or);border-radius:3px}
.tw{position:relative;display:flex;flex-direction:column;gap:6px}
.nab{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer}
.nab input{width:18px;height:18px;accent-color:var(--or)}
.nabig{display:none;font-size:46px;font-weight:800;color:var(--or);line-height:1}
.tile.na{border-style:solid;background:var(--navy)}
.tile.na .ti,.tile.na span{display:none}.tile.na b{color:#fff}.tile.na .nabig{display:block}
.addx{border-style:dashed;background:transparent;color:var(--or);font:inherit}
.addx .ti{font-size:34px;font-weight:300;line-height:1}
.rmx{position:absolute;top:6px;right:6px;z-index:3;width:28px;height:28px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:16px;cursor:pointer}
.dvs{display:flex;gap:6px;flex-wrap:wrap}.sc{font-size:12px;color:var(--mut)}
.ib{display:flex;gap:6px;align-items:center;font:inherit;font-weight:700;font-size:13px;padding:8px 12px}
.brand{background:radial-gradient(circle at 85% 8%,#2f66bd 0,transparent 42%),radial-gradient(circle at 10% 95%,#e4571b55 0,transparent 40%),linear-gradient(150deg,var(--navy) 55%,#1d4177)}
.acc{background:radial-gradient(circle at 20% 15%,var(--soft),transparent 55%)}
.box{animation:rise .6s ease both;box-shadow:0 14px 44px #12294b2e;border-top:4px solid var(--or)}
.tele{width:100%;max-width:520px;position:relative;z-index:1;margin-top:4px;filter:drop-shadow(0 6px 18px #0006)}
.brand .kick{letter-spacing:.14em;text-transform:uppercase;font-size:12px;opacity:.85;font-weight:700}
.brand .sub{font-size:18px;font-weight:700;color:#ffd2b8;margin-top:-10px}
.brand p.slg{font-size:18px;font-weight:800;color:#fff;border-left:4px solid var(--or);padding-left:12px;max-width:34ch}
.brand h2{max-width:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="camera" viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
<symbol id="pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9H3zM9 20v-6h6v6"/></symbol>
<symbol id="list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
<symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 5a3.5 3.5 0 010 7M22 20c0-3-2-5-5-5.5"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="out" viewBox="0 0 24 24"><path d="M9 4H4v16h5M16 8l4 4-4 4M20 12H9"/></symbol>
<symbol id="chk" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
</defs></svg>

<section id="auth">
  <div class="brand">
    <div class="kick">E&amp;S Engineering &amp; Services</div>
    <h2>E&amp;S <em>FieldOps</em></h2>
    <div class="sub">Reporte de Seguimiento On Site, Al Instante</div>
    <p class="slg">“Cada sitio, una señal. Cada reporte, una conexión.”</p>
    <p>Desde la torre hasta el último enlace de fibra, convertimos el trabajo de campo en datos que la red ya puede usar.</p>
  </div>
  <div class="acc"><div class="box card" id="ab" style="padding:22px"><p class="msg g">Cargando…</p></div></div>
</section>

<div id="app" hidden>
  <header><div class="sp"></div>
    <div class="chip"><div class="av" id="av"></div><span><b id="un"></b><small id="ur"></small></span></div>
    <button class="ib" id="lo" title="Cerrar sesión"><svg class="i"><use href="#out"/></svg><span>Salir</span></button></header>
  <nav class="nv" id="nv"></nav>
  <main id="mn"></main>
</div>
<div id="mdl" hidden><div class="card"><p id="mdt" style="margin:0 0 12px;font-weight:600"></p><input type="password" id="mdi" hidden style="margin-bottom:12px"><div class="row" style="justify-content:flex-end"><button class="btn s" id="mdn">Cancelar</button><button class="btn" id="mdy">Aceptar</button></div></div></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const ic=n=>`<svg class="i"><use href="#${n}"/></svg>`;
const TXT=[['sitio','Nombre de Sitio',1],['operador','Operador'],['llaves','Dirección de Llaves/Custodio'],['segAI','Contacto de Seguridad NOC'],['ingeniero','Inge Encargado/Contacto'],['tecnico','Nombre del Técnico']];
const IMG=[['gpsCentro','Ubicación GPS Central/Llaves','pin'],['fotoCentral','Foto Panorámica Central/Llaves','camera'],['panoSitio','Panorámica del sitio','camera'],['gpsSitio','Ubicación GPS de Sitio','pin']];

let exN=0,gmOpen=false,ses=null,rows=[],cuentas=[],view='home',editing=null,pend={},busy=0,q='';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const adm=()=>ses&&ses.rol==='admin';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',3600)}
function ask(msg,o={}){return new Promise(res=>{const m=$('#mdl'),i=$('#mdi'),y=$('#mdy'),n=$('#mdn');$('#mdt').textContent=msg;i.hidden=!o.input;i.value='';y.textContent=o.ok||'Aceptar';y.className='btn'+(o.danger?' r':'');m.hidden=false;if(o.input)i.focus();const end=v=>{m.hidden=true;y.onclick=n.onclick=null;res(v)};y.onclick=()=>end(o.input?i.value:true);n.onclick=()=>end(o.input?null:false)})}

// Sistema de Criptografía y Base de Datos LocalStorage
const ITER=600000,hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''),unhex=h=>Uint8Array.from(h.match(/../g)||[],x=>parseInt(x,16));
async function kdf(p,sl,it){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unhex(sl),iterations:it},k,256))}
const same=(a,b)=>{a=String(a);b=String(b);if(a.length!==b.length)return false;let r=0;for(let i=0;i<a.length;i++)r|=a.charCodeAt(i)^b.charCodeAt(i);return r===0};
const rnd=n=>hex(crypto.getRandomValues(new Uint8Array(n)));
async function mkCred(p){const sl=rnd(16);return{salt:sl,iter:ITER,hash:await kdf(p,sl,ITER)}}
const PA='ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
function genPw(){let s='';for(const x of crypto.getRandomValues(new Uint8Array(14)))s+=PA[x%PA.length];return/\d/.test(s)&&/[a-z]/.test(s)&&/[A-Z]/.test(s)?s:genPw()}
const okPw=p=>p.length>=10&&/[a-zA-Z]/.test(p)&&/\d/.test(p);

// Inicializar Administrador por defecto si no existe
async function initDB(){
  let d=JSON.parse(localStorage.getItem('fo_db')||'{"cuentas":{},"visitas":{},"perfiles":{}}');
  const adminEmail='wcarloshe@gmail.com';
  const adminPass='1234567890ch';
  const ek=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(adminEmail)).then(b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''));
  
  if(!d.cuentas[ek]){
    const k=await mkCred(adminPass);
    d.cuentas[ek]={nombre:'Carlos Hernán',rol:'admin',estado:'activo',salt:k.salt,iter:k.iter,hash:k.hash,createdAt:Date.now()};
    d.perfiles[ek]={email:adminEmail,nombre:'Carlos Hernán'};
    localStorage.setItem('fo_db',JSON.stringify(d));
  }
}

function getDB(){return JSON.parse(localStorage.getItem('fo_db')||'{"cuentas":{},"visitas":{},"perfiles":{}}')}
function saveDB(d){localStorage.setItem('fo_db',JSON.stringify(d))}

function authView(m,x){
  $('#auth').hidden=false;$('#app').hidden=true;
  const fld=(id,l,t,ac)=>`<label class="l" style="margin-top:10px">${l}</label><input type="${t}" id="${id}" autocomplete="${ac}" maxlength="120"${t==='email'?' autocapitalize="none" spellcheck="false"':''}>`;
  const hd=(a,c)=>`<h3 style="margin:0 0 4px">${a}</h3><p style="margin:0 0 12px;color:var(--mut);font-size:13px">${c}</p>`;
  const btn=(id,t,c)=>`<button class="btn ${c||''} w" id="${id}" style="margin-top:12px">${t}</button>`;
  let h='';
  if(m==='other'||m==='err'||m==='start')h=hd('Iniciar sesión','Usa tu correo y contraseña registrados.')+fld('le','Correo','email','username')+fld('lp','Contraseña','password','current-password')+btn('g2','Ingresar')+(x?`<p class="msg">${esc(x)}</p>`:'');
  $('#ab').innerHTML=h+'<p class="msg" id="am"></p>';
  const on=(i,f)=>{const e=$('#'+i);if(e)e.onclick=f};
  on('g2',doLogin);
  const f=$('#lp');if(f){f.onkeydown=e=>{if(e.key==='Enter')doLogin()};(($('#le')||f)).focus()}
}

async function doLogin(){
  const le=$('#le'),p=$('#lp').value,b=$('#g2');
  const em=le.value.trim().toLowerCase();
  if(!em||!p)return msg('Escribe tu correo y contraseña');
  b.disabled=true;msg('Verificando…',1);
  try{
    const ek=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(em)))).map(x=>x.toString(16).padStart(2,'0')).join('');
    const dbData=getDB();
    const c=dbData.cuentas[ek];
    if(!c||!c.hash){msg('Correo o contraseña incorrectos');b.disabled=false;return}
    const ok=same(await kdf(p,c.salt,c.iter||ITER),c.hash);
    if(!ok){msg('Correo o contraseña incorrectos');b.disabled=false;return}
    if(c.estado!=='activo'){msg('Esta cuenta está desactivada.');b.disabled=false;return}
    
    ses={user:ek,cuenta:ek,nombre:c.nombre,rol:c.rol,hash:c.hash};
    try{localStorage.setItem('fo_ses',JSON.stringify(ses))}catch(e){}
    enter();
  }catch(e){msg('Error al verificar');b.disabled=false}
}
function msg(t,g){const e=$('#am');if(e){e.textContent=t;e.className='msg'+(g?' g':'')}}

function enter(){
  $('#auth').hidden=true;$('#app').hidden=false;
  $('#av').textContent=ses.nombre.trim()[0].toUpperCase();$('#un').textContent=ses.nombre;$('#ur').textContent=ses.rol==='admin'?'Administrador':'Técnico';
  loadData();
  go('home');
}

function loadData(){
  const dbData=getDB();
  cuentas=Object.keys(dbData.cuentas).map(k=>({...dbData.cuentas[k],id:k}));
  const allRows=[];
  Object.keys(dbData.visitas).forEach(uid=>{
    const items=dbData.visitas[uid]||[];
    items.forEach(it=>allRows.push({...it,uid}));
  });
  rows=allRows.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
}

function logout(){ses=null;try{localStorage.removeItem('fo_ses')}catch(e){}authView('other')}
$('#lo').onclick=logout;

function navPaint(){
  const it=[['home','Inicio','home'],['new','Nuevo','plus'],['list','Registros','list']];if(adm())it.push(['users','Usuarios','users']);
  $('#nv').innerHTML=it.map(([k,l,i])=>`<button data-v="${k}" class="${view===k?'on':''}">${ic(i)}${l}</button>`).join('');
  document.querySelectorAll('#nv button').forEach(b=>b.onclick=()=>go(b.dataset.v));
}
function go(v,r){view=v;if(v==='new')buildForm(r);navPaint();paint();window.scrollTo(0,0)}
const mine=()=>adm()?rows:rows.filter(r=>r.cuenta===ses.cuenta||r.uid===ses.user);
function paint(){
  if(!ses||view==='new')return;
  loadData();
  const m=$('#mn');
  if(view==='home')m.innerHTML=home();
  if(view==='list')m.innerHTML=listH();
  if(view==='users')m.innerHTML=usersH();
  m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  m.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.id,b));
  const qi=$('#q');if(qi)qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;paint();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
  const cv=$('#csv');if(cv)cv.onclick=csv;
  m.querySelectorAll('[data-rol]').forEach(s=>s.onchange=()=>setRol(s.dataset.rol,s.value));
}

function home(){
  const l=mine(),t=today(),days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return[ymd(d),['D','L','M','M','J','V','S'][d.getDay()]]});
  const cnt=days.map(([d])=>l.filter(r=>r.fecha===d).length),mx=Math.max(1,...cnt);
  const hoy=l.filter(r=>r.fecha===t).length,sem=cnt.reduce((a,b)=>a+b,0);
  const tec=cuentas.filter(c=>c.hash&&c.rol==='tecnico'&&c.estado==='activo').length;
  const h=new Date().getHours(),sal=h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches';
  let s=`<div class="hero"><div><h2>${sal}, ${esc(ses.nombre.split(' ')[0])}</h2><p>${adm()?'Panel de administración de reportes':'Registra tus visitas técnicas del día'}</p></div><button class="btn" data-go="new">${ic('plus')}Nuevo reporte</button></div>`;
  s+=`<div class="stats"><div class="st"><b>${l.length}</b><span>${adm()?'Reportes totales':'Mis reportes'}</span></div><div class="st"><b>${hoy}</b><span>Hoy</span></div><div class="st"><b>${sem}</b><span>Últimos 7 días</span></div>`;
  if(adm())s+=`<div class="st"><b>${tec}</b><span>Técnicos activos</span></div>`;
  s+=`</div><div class="card"><h3>Actividad semanal</h3><div class="bars">${days.map(([d,n],i)=>`<div><i style="height:${cnt[i]/mx*85}%" title="${cnt[i]}"></i>${cnt[i]||''}<br>${n}</div>`).join('')}</div></div>`;
  s+=`<div class="card"><h3>Últimos reportes</h3>${l.slice(0,4).map(r=>`<p style="margin:6px 0"><b>${esc(r.sitio)}</b> · <span style="color:var(--mut)">${esc(r.fecha)} · ${esc(r.createdByName||r.tecnico||'')}</span></p>`).join('')||'<div class="empty">Aún no hay reportes.</div>'}</div>`;
  return s;
}

function tileH(k,l,i,o={}){
  const v=pend[k],na=v==='NA',has=v&&!na;
  return `<div class="tw"><label class="tile${has?' ok':''}${na?' na':''}" id="tl_${k}"><input type="file" accept="image/*" data-k="${k}" hidden><div class="ti">${ic(i)}</div><b>${l}${o.req?' <i style="color:#ff8a60;font-style:normal">*</i>':''}</b><span id="s_${k}">${has?'Toca para cambiar':'Toca para subir foto'}</span><div class="nabig">N/A</div><img alt=""${has?` src="${v}"`:''}></label>${o.na?`<label class="nab"><input type="checkbox" data-na="${k}"${na?' checked':''}> N/A · No aplica</label>`:''}${o.rm!==undefined?`<button type="button" class="rmx" data-rm="${o.rm}" title="Quitar">×</button>`:''}</div>`;
}
function exH(){
  let h='';for(let j=0;j<exN;j++)h+=tileH('x'+j,'Foto adicional '+(j+1),'camera',{rm:j});
  if(exN<4)h+=`<button type="button" class="tile addx" id="addx"><div class="ti">+</div><b>Agregar más fotos</b><span>Opcional · ${exN}/4 adicionales</span></button>`;
  $('#exs').innerHTML=h;bind($('#exs'));
}
function bind(root){
  root.querySelectorAll('input[type=file]').forEach(i=>i.onchange=()=>upImg(i));
  root.querySelectorAll('[data-na]').forEach(c=>c.onchange=()=>setNA(c.dataset.na,c.checked));
  root.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const j=+b.dataset.rm;for(let i=j;i<exN-1;i++)pend['x'+i]=pend['x'+(i+1)];delete pend['x'+(exN-1)];exN--;exH()});
  const a=root.querySelector('#addx');if(a)a.onclick=()=>{pend['x'+exN]='';exN++;exH()};
}
function setNA(k,on){pend[k]=on?'NA':'';const t=$('#tl_'+k);t.classList.toggle('na',on);t.classList.remove('ok');$('#s_'+k).textContent=on?'No aplica':'Toca para subir foto'}

function buildForm(r){
  r=r||{};editing=r.id||null;pend={};
  for(const [k] of IMG)pend[k]=r[k]||'';
  pend.act1=r.act1||'';pend.act2=r.act2||'';exN=0;(r.extras||[]).slice(0,4).forEach((v,j)=>{pend['x'+j]=v;exN++});
  let h=`<div class="card"><h3>${editing?'Editar reporte':'Nueva visita técnica'}</h3><div class="sec">Datos del sitio</div><div class="grid">`;
  h+=`<div><label class="l">Fecha de Registro <i>*</i></label><input type="date" id="f_fecha" value="${esc(r.fecha||today())}"></div>`;
  for(const [k,l,req] of TXT){const v=r[k]||(k==='tecnico'?ses.nombre:'');h+=`<div><label class="l">${l}${req?' <i>*</i>':''}</label><input type="text" id="f_${k}" value="${esc(v)}" autocomplete="off"></div>`}
  h+=`<div><label class="l">Coordenadas GPS (lat, lng)</label><input type="text" id="f_coords" placeholder="4.710989, -74.072092" value="${esc(r.coords||'')}"><button type="button" class="btn n w" id="gps" style="margin-top:6px">${ic('pin')}Capturar ubicación</button><div class="gs" id="gst">Ubicación del dispositivo</div><a id="gml" class="btn s w" target="_blank" rel="noopener" hidden style="margin-top:6px">Ver en Google Maps</a></div>`;
  h+=`<div style="grid-column:1/-1"><label class="l">Nota de Tipo de Acceso</label><textarea id="f_acceso">${esc(r.acceso||'')}</textarea></div></div>`;
  h+=`<div class="sec">Fotos del sitio</div><div class="tiles">${IMG.map(([k,l,i],n)=>tileH(k,l,i,{req:1,na:n<2})).join('')}</div>`;
  h+=`<div class="sec">Actividad a Realizar</div><textarea id="f_actividad" placeholder="Describe la actividad">${esc(r.actividad||'')}</textarea>`;
  h+=`<div class="sec">Fotos de Actividad</div><div class="tiles">${tileH('act1','Fotos de Actividad 1','camera',{req:!editing})}${tileH('act2','Fotos de Actividad 2','camera',{req:!editing})}</div><div class="tiles" id="exs" style="margin-top:12px"></div>`;
  h+=`<div class="row" style="margin-top:18px"><button class="btn" id="save">${ic('chk')}${editing?'Guardar cambios':'Guardar reporte'}</button>${editing?'<button class="btn s" id="cancel">Cancelar</button>':''}</div></div>`;
  $('#mn').innerHTML=h;exH();bind($('#mn'));
  $('#gps').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{
    const c=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6);
    $('#f_coords').value=c;toast('Ubicación capturada');
  },()=>toast('No se pudo obtener el GPS'));
  $('#save').onclick=save;
  if(editing)$('#cancel').onclick=()=>go('list');
}

function shrink(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72));URL.revokeObjectURL(u)};im.onerror=no;im.src=u})}
async function upImg(inp){
  const k=inp.dataset.k,f=inp.files[0];if(!f)return;
  const s=$('#s_'+k);s.textContent='Cargando…';
  try{const base64=await shrink(f);pend[k]=base64;const t=$('#tl_'+k);t.querySelector('img').src=base64;t.classList.remove('na');t.classList.add('ok');s.textContent='Listo ✓'}
  catch(e){s.textContent='Error al cargar'}
}

async function save(){
  const d={fecha:$('#f_fecha').value,acceso:$('#f_acceso').value.trim(),coords:$('#f_coords').value.trim(),actividad:$('#f_actividad').value.trim()};
  for(const [k] of TXT)d[k]=$('#f_'+k).value.trim();
  if(!d.fecha||!d.sitio)return toast('Completa fecha y nombre del sitio');
  for(const [k,l] of IMG){if(!pend[k])return toast('Falta: '+l);d[k]=pend[k]}
  d.act1=pend.act1||'';d.act2=pend.act2||'';d.extras=[...Array(exN)].map((_,j)=>pend['x'+j]).filter(v=>v&&v!=='NA');
  
  const dbData=getDB();
  const now=Date.now();
  if(!dbData.visitas[ses.user])dbData.visitas[ses.user]=[];
  
  if(editing){
    dbData.visitas[ses.user]=dbData.visitas[ses.user].map(x=>x.id===editing?{...x,...d,updatedAt:now}:x);
  }else{
    dbData.visitas[ses.user].unshift({...d,id:'r_'+Math.random().toString(36).substr(2,9),cuenta:ses.cuenta,createdByName:ses.nombre,createdAt:now});
  }
  saveDB(dbData);
  toast('Reporte guardado con éxito');
  go('list');
}

function listH(){
  let l=mine();if(q){const t=q.toLowerCase();l=l.filter(r=>[r.sitio,r.operador,r.tecnico,r.fecha].join(' ').toLowerCase().includes(t))}
  let h=`<div class="card row"><input type="text" id="q" placeholder="Buscar sitio, operador, técnico o fecha" value="${esc(q)}" style="flex:1;min-width:200px">${adm()?'<button class="btn s" id="csv">Exportar CSV</button>':''}</div>`;
  if(!l.length)h+='<div class="empty">No hay reportes para mostrar.</div>';
  for(const r of l){
    h+=`<div class="card rec"><div><h3>${esc(r.sitio)}</h3><p>${esc(r.fecha)} · ${esc(r.operador||'Sin operador')} · Técnico: ${esc(r.tecnico||'-')}</p><p>${esc(r.acceso||'')}</p><p><b>Actividad:</b> ${esc(r.actividad||'')}</p><div class="th">${[...IMG.map(x=>r[x[0]]),r.act1,r.act2,...(r.extras||[])].filter(v=>v&&v!=='NA').map(v=>`<img src="${v}" alt="">`).join('')}</div></div>`;
    h+=`<div class="acts"><button class="btn s" data-a="ed" data-id="${r.id}">Editar</button><button class="btn d" data-a="del" data-id="${r.id}">Eliminar</button></div>`;
    h+='</div>';
  }
  return h;
}

async function regCuenta(btn){
  const n=$('#cn').value.trim(),em=$('#ce').value.trim().toLowerCase(),rl=$('#cr').value;let pw=$('#cp').value;
  if(n.length<3)return toast('Escribe el nombre completo');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return toast('Escribe un correo válido');
  if(!pw)pw=genPw();
  if(!okPw(pw))return toast('La contraseña debe tener 10+ caracteres, con letras y números');
  btn.disabled=true;
  try{
    const ek=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(em)))).map(x=>x.toString(16).padStart(2,'0')).join('');
    const dbData=getDB();
    if(dbData.cuentas[ek]){toast('Ese correo ya está registrado');btn.disabled=false;return}
    const k=await mkCred(pw);
    dbData.cuentas[ek]={nombre:n,rol:rl,estado:'activo',salt:k.salt,iter:k.iter,hash:k.hash,createdAt:Date.now()};
    dbData.perfiles[ek]={email:em,nombre:n};
    saveDB(dbData);
    loadData();
    toast('Cuenta registrada con éxito. Contraseña: '+pw);
    paint();
  }catch(e){toast('No se pudo registrar');btn.disabled=false}
}

let cred=null;
function usersH(){
  const ok=cuentas.filter(c=>c.hash);
  let h=`<div class="card" id="rgf"><h3>Registrar cuenta</h3><p class="sc" style="margin:0 0 10px">Crea cuentas para técnicos u otros administradores.</p><div class="grid"><div><label class="l">Nombre completo</label><input type="text" id="cn" maxlength="80"></div><div><label class="l">Correo</label><input type="email" id="ce" maxlength="120" autocapitalize="none"></div><div><label class="l">Rol</label><select id="cr"><option value="tecnico">Técnico</option><option value="admin">Administrador</option></select></div><div><label class="l">Contraseña (10+, letras y números)</label><div class="row"><input type="text" id="cp" maxlength="100" placeholder="Vacío = se genera una segura" style="flex:1;min-width:0"><button class="btn s" data-a="gen" type="button">Generar</button></div></div></div><button class="btn" data-a="reg" style="margin-top:12px">${ic('plus')}Registrar cuenta</button></div>`;
  h+='<div class="sec">Cuentas registradas</div>';
  for(const c of ok){
    const email=(getDB().perfiles[c.id]||{}).email||'Correo no disponible';
    h+=`<div class="card rec"><div><h3>${esc(c.nombre)} <span class="tag ${c.estado==='activo'?'activo':'inactivo'}">${esc(c.estado)}</span></h3><p>${esc(email)}</p><select data-rol="${esc(c.id)}" style="max-width:240px;margin-top:6px"><option value="tecnico"${c.rol==='tecnico'?' selected':''}>Técnico</option><option value="admin"${c.rol==='admin'?' selected':''}>Administrador</option></select></div><div class="acts"><button class="btn d" data-a="rm" data-id="${esc(c.id)}">Eliminar</button></div></div>`;
  }
  return h;
}

async function act(a,id,btn){
  if(a==='ed'){const r=rows.find(x=>x.id==id);if(r)go('new',r)}
  if(a==='del'){
    if(!await ask('¿Eliminar reporte?',{ok:'Eliminar',danger:1}))return;
    const dbData=getDB();
    Object.keys(dbData.visitas).forEach(uid=>{dbData.visitas[uid]=(dbData.visitas[uid]||[]).filter(x=>x.id!==id)});
    saveDB(dbData);loadData();paint();toast('Eliminado');
  }
  if(a==='gen'){const i=$('#cp');if(i)i.value=genPw()}
  if(a==='reg')await regCuenta(btn);
  if(a==='rm'){
    if(!await ask('¿Eliminar esta cuenta?',{ok:'Eliminar',danger:1}))return;
    const dbData=getDB();delete dbData.cuentas[id];delete dbData.perfiles[id];saveDB(dbData);loadData();paint();toast('Cuenta eliminada');
  }
}

function setRol(id,rol){
  const dbData=getDB();
  if(dbData.cuentas[id]){dbData.cuentas[id].rol=rol;saveDB(dbData);loadData();toast('Rol actualizado')}
}

const cell=v=>{v=String(v==null?'':Array.isArray(v)?v.join(' '):v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
function csvText(){const cols=['fecha',...TXT.map(t=>t[0]),'coords','acceso','actividad'];return '\ufeff'+[cols.join(',')].concat(rows.map(r=>cols.map(c=>cell(r[c])).join(','))).join('\n')}
function csv(){const blob=new Blob([csvText()],{type:'text/csv;charset=utf-8;'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='visitas_'+today()+'.csv';a.click()}

// Arranque
(async()=>{
  await initDB();
  let savedSes=null;try{savedSes=JSON.parse(localStorage.getItem('fo_ses')||'null')}catch(e){}
  if(savedSes&&savedSes.user){
    ses=savedSes;
    enter();
  }else{
    authView('other');
  }
})();
</script>
</body>
