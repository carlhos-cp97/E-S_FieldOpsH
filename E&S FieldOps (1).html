<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E&amp;S FieldOps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{--navy:#12294b;--or:#e4571b;--bg:#f1f5fa;--card:#fff;--ink:#12263a;--mut:#5f7186;--line:#d6e0ec;--ok:#1b8a52;--bad:#c0392b;--soft:#fff3ec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1627;--card:#13233b;--ink:#e8eff8;--mut:#9fb2c7;--line:#28425f;--ok:#4cd08a;--bad:#ff8f84;--soft:#2a1e1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1627;--card:#13233b;--ink:#e8eff8;--mut:#9fb2c7;--line:#28425f;--ok:#4cd08a;--bad:#ff8f84;--soft:#2a1e1a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo{height:40px;width:auto;background:#fff;border-radius:10px;padding:4px 8px}
/* auth */
#auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.brand{background:linear-gradient(150deg,var(--navy) 55%,#1d4177);color:#fff;padding:40px;display:flex;flex-direction:column;justify-content:center;gap:22px;position:relative;overflow:hidden}
.brand:after{content:"";position:absolute;right:-90px;bottom:-90px;width:300px;height:300px;border-radius:50%;background:var(--or);opacity:.9}
.brand .logo{height:64px;align-self:flex-start;animation:rise .7s ease both}
.brand h2{font-size:34px;line-height:1.1;margin:0;font-weight:800;max-width:14ch}
.brand h2 em{font-style:normal;color:#ff9b66}
.brand p{margin:0;max-width:38ch;opacity:.85}
.brand ul{list-style:none;padding:0;margin:0;display:grid;gap:10px;position:relative;z-index:1}
.brand li{display:flex;gap:10px;align-items:center}
.brand li svg{color:#ff9b66}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.acc{display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:400px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{border:0;background:none;padding:10px;border-radius:9px;font:inherit;font-weight:700;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 4px #0002}
@media (prefers-color-scheme:dark){.seg button.on{color:var(--or)}}
/* app */
header{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;border-bottom:3px solid var(--or)}
header .sp{flex:1}
.chip{display:flex;align-items:center;gap:8px;font-size:13px}
.chip b{display:block;line-height:1.1}.chip small{opacity:.75}
.av{width:34px;height:34px;border-radius:50%;background:var(--or);display:grid;place-items:center;font-weight:800}
.ib{background:#ffffff1f;border:0;color:#fff;border-radius:10px;padding:8px;cursor:pointer;display:grid}
nav.nv{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.nv button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:10px;cursor:pointer;position:relative}
nav.nv button.on{color:var(--or);background:var(--soft)}
nav.nv .bd{position:absolute;top:2px;right:22%;background:var(--or);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
main{max-width:1020px;margin:0 auto;padding:16px 14px 100px}
@media (min-width:760px){nav.nv{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));bottom:auto;border:0;border-bottom:1px solid var(--line);padding:6px 16px;gap:6px;justify-content:center}nav.nv button{flex:none;flex-direction:row;font-size:14px;padding:8px 16px;gap:8px}main{padding-bottom:40px}}
@media (max-width:760px){#auth{grid-template-columns:1fr}.brand{padding:26px 22px 60px}.brand h2{font-size:26px}.brand ul{display:none}.chip span{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.st{border-radius:14px;padding:14px;color:#fff;background:linear-gradient(135deg,var(--navy),#27508f)}
.st:nth-child(2){background:linear-gradient(135deg,var(--or),#f08a4b)}.st:nth-child(3){background:linear-gradient(135deg,#0e7a6b,#2bb59f)}.st:nth-child(4){background:linear-gradient(135deg,#6b4bc0,#9b7fe6)}
.st b{display:block;font-size:30px;line-height:1.1}.st span{font-size:12px;opacity:.9}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:linear-gradient(var(--or),#f5a070);border-radius:6px 6px 2px 2px;min-height:3px;margin-bottom:4px}
.hero{background:linear-gradient(120deg,var(--navy),#24498a);color:#fff;border-radius:16px;padding:20px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.hero h2{margin:0;font-size:22px}.hero p{margin:2px 0 0;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
label.l{display:block;font-weight:600;font-size:13px;margin-bottom:4px}label.l i{color:var(--bad);font-style:normal}
input[type=text],input[type=password],input[type=date],textarea,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--or)}
textarea{min-height:76px;resize:vertical}
.btn{padding:11px 16px;border:0;border-radius:10px;background:var(--or);color:#fff;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.n{background:var(--navy)}.btn.s{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}.btn.d{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}.btn.w{width:100%}
@media (prefers-color-scheme:dark){.btn.s{color:#9ec3f5;border-color:#9ec3f5}}
.btn:disabled{opacity:.55;cursor:wait}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;grid-column:1/-1}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;min-height:170px;border:2px dashed var(--or);border-radius:14px;background:var(--soft);cursor:pointer;overflow:hidden;padding:12px;transition:background .15s}
.tile:hover{background:var(--card)}
.tile .ti{width:54px;height:54px;border-radius:50%;background:var(--or);color:#fff;display:grid;place-items:center}
.tile .ti svg{width:28px;height:28px}
.tile b{font-size:14px}.tile span{font-size:12px;color:var(--mut)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.tile.ok{border-style:solid;border-color:var(--ok)}.tile.ok img{display:block}
.tile.ok .ti,.tile.ok b,.tile.ok span{position:relative;z-index:1;color:#fff;text-shadow:0 1px 4px #000}
.tile.ok .ti{background:#0009}.tile.ok:before{content:"";position:absolute;inset:0;background:linear-gradient(#0000 40%,#000a);z-index:1}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rec{display:grid;grid-template-columns:1fr auto;gap:8px 14px}
.rec h3{margin:0 0 2px}.rec p{margin:1px 0;color:var(--mut);font-size:13px}
.th{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.th img{width:56px;height:44px;object-fit:cover;border-radius:6px}
.acts{display:flex;flex-direction:column;gap:6px;min-width:130px}
@media (max-width:520px){.rec{grid-template-columns:1fr}.acts{flex-direction:row;flex-wrap:wrap}}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--line);color:var(--ink)}
.tag.activo{background:#d6f3e3;color:#11613a}.tag.pendiente{background:#ffe8c9;color:#8a4b00}.tag.inactivo{background:#fbd9d5;color:#8c241a}
.msg{font-size:13px;margin:8px 0 0;color:var(--bad);min-height:18px}.msg.g{color:var(--ok)}
.gs{font-size:12px;color:var(--mut);margin-top:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:20;max-width:90%;box-shadow:0 4px 16px #0004}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.btn.r{background:var(--bad);color:#fff}
#mdl{position:fixed;inset:0;background:#000a;z-index:50;display:grid;place-items:center;padding:20px}
#mdl .card{max-width:380px;width:100%;margin:0}
.fb{margin-top:8px;padding:10px;border:1.5px dashed var(--or);border-radius:10px;font-size:12px;display:grid;gap:6px;color:var(--mut)}
a.btn{text-decoration:none}

.sec{display:flex;align-items:center;gap:8px;margin:20px 0 10px;font-size:16px;font-weight:800}
.sec:before{content:"";width:5px;height:20px;background:var(--or);border-radius:3px}
.tw{position:relative;display:flex;flex-direction:column;gap:6px}
.nab{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer}
.nab input{width:18px;height:18px;accent-color:var(--or)}
.nabig{display:none;font-size:46px;font-weight:800;color:var(--or);line-height:1}
.tile.na{border-style:solid;background:var(--navy)}
.tile.na .ti,.tile.na span{display:none}.tile.na b{color:#fff}.tile.na .nabig{display:block}
.addx{border-style:dashed;background:transparent;color:var(--or);font:inherit}
.addx .ti{font-size:34px;font-weight:300;line-height:1}
.rmx{position:absolute;top:6px;right:6px;z-index:3;width:28px;height:28px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="camera" viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
<symbol id="pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9H3zM9 20v-6h6v6"/></symbol>
<symbol id="list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
<symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 5a3.5 3.5 0 010 7M22 20c0-3-2-5-5-5.5"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="out" viewBox="0 0 24 24"><path d="M9 4H4v16h5M16 8l4 4-4 4M20 12H9"/></symbol>
<symbol id="chk" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
</defs></svg>

<section id="auth">
  <div class="brand">
    <img class="logo" alt="E&amp;S Engineering &amp; Services">
    <h2>Reportes de campo, <em>al instante</em></h2>
    <p>Registra visitas técnicas con fotos y GPS, y genera el PDF de cada sitio en segundos.</p>
    <ul>
      <li><svg class="i"><use href="#pin"/></svg>Ubicación GPS exacta con un toque</li>
      <li><svg class="i"><use href="#camera"/></svg>Fotos del sitio organizadas</li>
      <li><svg class="i"><use href="#users"/></svg>Roles de administrador y técnico</li>
    </ul>
  </div>
  <div class="acc"><div class="box card" style="padding:22px">
    <div class="seg"><button id="sa" class="on">Ingresar</button><button id="sb">Crear cuenta</button></div>
    <div id="fa">
      <label class="l">Usuario</label><input type="text" id="lu" autocomplete="username" autocapitalize="none">
      <label class="l" style="margin-top:10px">Contraseña</label><input type="password" id="lp" autocomplete="current-password">
      <button class="btn w" id="bl" style="margin-top:14px">Ingresar</button>
    </div>
    <div id="fb" hidden>
      <label class="l">Nombre completo</label><input type="text" id="rn" autocomplete="name">
      <label class="l" style="margin-top:10px">Usuario (letras y números)</label><input type="text" id="ru" autocapitalize="none">
      <label class="l" style="margin-top:10px">Contraseña (mín. 6)</label><input type="password" id="rp" autocomplete="new-password">
      <label class="l" style="margin-top:10px">Repetir contraseña</label><input type="password" id="rq" autocomplete="new-password">
      <button class="btn w" id="br" style="margin-top:14px">Crear cuenta</button>
    </div>
    <p class="msg" id="am"></p>
    <button class="btn n w" id="bo" hidden style="margin-top:10px">Entrar como administrador</button>
  </div></div>
</section>

<div id="app" hidden>
  <header><img class="logo" alt="E&amp;S"><div class="sp"></div>
    <div class="chip"><div class="av" id="av"></div><span><b id="un"></b><small id="ur"></small></span></div>
    <button class="ib" id="lo" title="Salir"><svg class="i"><use href="#out"/></svg></button></header>
  <nav class="nv" id="nv"></nav>
  <main id="mn"></main>
</div>
<div id="mdl" hidden><div class="card"><p id="mdt" style="margin:0 0 12px;font-weight:600"></p><input type="password" id="mdi" hidden style="margin-bottom:12px"><div class="row" style="justify-content:flex-end"><button class="btn s" id="mdn">Cancelar</button><button class="btn" id="mdy">Aceptar</button></div></div></div>
<div id="toast"></div>

let db,assets,dl,user,ownerAdmin=false,ownerId='',ownerName='Administrador',ses=null,rows=[],cuentas=[],view='home',editing=null,pend={},busy=0,q='',unsubs=[],gacc='';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const salt=()=>[...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,'0')).join('');
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3600)}
function ask(msg,o={}){return new Promise(res=>{const m=$('#mdl'),i=$('#mdi'),y=$('#mdy'),n=$('#mdn');$('#mdt').textContent=msg;i.hidden=!o.input;i.value='';y.textContent=o.ok||'Aceptar';y.className='btn'+(o.danger?' r':'');m.hidden=false;if(o.input)i.focus();
const end=v=>{m.hidden=true;y.onclick=n.onclick=null;res(v)};y.onclick=()=>end(o.input?i.value:true);n.onclick=()=>end(o.input?null:false)})}
function am(m,g){const e=$('#am');e.textContent=m;e.className='msg'+(g?' g':'')}

/* ---------- Autenticación ---------- */
$('#sa').onclick=()=>{$('#sa').className='on';$('#sb').className='';$('#fa').hidden=false;$('#fb').hidden=true;am('')};
$('#sb').onclick=()=>{$('#sb').className='on';$('#sa').className='';$('#fb').hidden=false;$('#fa').hidden=true;am('')};
$('#lp').onkeydown=e=>{if(e.key=='Enter')$('#bl').click()};
$('#bl').onclick=async()=>{
  if(!db)return am('Sin conexión a la base de datos. Abre el enlace desde tu sesión de Claude.');
  const u=norm($('#lu').value),p=$('#lp').value;if(!u||!p)return am('Escribe usuario y contraseña');
  $('#bl').disabled=true;
  try{
    const s=await db.collection('cuentas').doc(u).get();
    if(!s.exists)throw 0;const c=s.data();
    if((await sha(c.salt+p))!==c.hash)throw 0;
    if(c.estado==='pendiente'){am('Tu cuenta está pendiente de aprobación por un administrador.')}
    else if(c.estado==='inactivo'){am('Tu cuenta está desactivada. Contacta al administrador.')}
    else{try{localStorage.setItem('fo_ses',u)}catch(e){}enter(u,c)}
  }catch(e){am('Usuario o contraseña incorrectos')}
  $('#bl').disabled=false;
};
$('#br').onclick=async()=>{
  if(!db)return am('Sin conexión a la base de datos.');
  const n=$('#rn').value.trim(),u=norm($('#ru').value),p=$('#rp').value;
  if(!n||u.length<3)return am('Escribe tu nombre y un usuario de 3+ caracteres');
  if(p.length<6)return am('La contraseña debe tener al menos 6 caracteres');
  if(p!==$('#rq').value)return am('Las contraseñas no coinciden');
  $('#br').disabled=true;
  try{
    const ref=db.collection('cuentas').doc(u);
    if((await ref.get()).exists){am('Ese usuario ya existe');$('#br').disabled=false;return}
    const first=!user&&(await db.collection('cuentas').limit(1).get()).docs.length===0,sl=salt();
    const c={nombre:n,user:u,salt:sl,hash:await sha(sl+p),rol:first?'admin':'tecnico',estado:first?'activo':'pendiente',createdAt:Date.now()};
    await ref.set(c);
    if(first){try{localStorage.setItem('fo_ses',u)}catch(e){}enter(u,c)}
    else{$('#sa').click();$('#lu').value=u;am('Cuenta creada. Un administrador debe aprobarla antes de ingresar.',1)}
  }catch(e){am('No se pudo crear la cuenta: '+(e.code||'error'))}
  $('#br').disabled=false;
};
function enter(u,c){
  ses={user:u,nombre:c.nombre,rol:c.rol};
  $('#auth').hidden=true;$('#app').hidden=false;
  $('#av').textContent=c.nombre.trim()[0].toUpperCase();$('#un').textContent=c.nombre;$('#ur').textContent=adm()?'Administrador':'Técnico';
  unsubs.push(db.collection('visitas').orderBy('createdAt','desc').onSnapshot(s=>{rows=s.docs.map(x=>({id:x.id,...x.data()}));if(view!=='new')paint()},e=>toast('Error de datos: '+(e.code||''))));
  unsubs.push(db.collection('cuentas').onSnapshot(s=>{cuentas=s.docs.map(x=>({id:x.id,...x.data()}));
    const me=cuentas.find(x=>x.id===u);if(me&&(me.estado!=='activo')){logout();return}
    if(me&&me.rol!==ses.rol){ses.rol=me.rol;location.reload()}
    navPaint();if(view==='users')paint()},()=>{}));
  go('home');
}
function logout(){unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];ses=null;try{localStorage.removeItem('fo_ses')}catch(e){}if(ownerAdmin)$('#bo').hidden=false;$('#app').hidden=true;$('#auth').hidden=false;$('#lp').value=''}
$('#lo').onclick=logout;

function navPaint(){
  const it=[['home','Inicio','home'],['new','Nuevo','plus'],['list','Registros','list']];if(adm())it.push(['users','Usuarios','users']);
  const pen=cuentas.filter(c=>c.estado==='pendiente').length;
  $('#nv').innerHTML=it.map(([k,l,i])=>`<button data-v="${k}" class="${view===k?'on':''}">${ic(i)}${l}${k==='users'&&pen?`<span class="bd">${pen}</span>`:''}</button>`).join('');
  document.querySelectorAll('#nv button').forEach(b=>b.onclick=()=>go(b.dataset.v));
}
function go(v,r){view=v;if(v==='new')buildForm(r);navPaint();paint();window.scrollTo(0,0)}
const mine=()=>adm()?rows:rows.filter(r=>r.createdBy===ses.user);
function paint(){
  if(!ses||view==='new')return;
  const m=$('#mn');
  if(view==='home')m.innerHTML=home();
  if(view==='list')m.innerHTML=listH();
  if(view==='users')m.innerHTML=usersH();
  m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  m.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.id,b));
  const qi=$('#q');if(qi)qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;paint();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
  const cv=$('#csv');if(cv)cv.onclick=csv;
  m.querySelectorAll('[data-rol]').forEach(s=>s.onchange=()=>setRol(s.dataset.rol,s.value));
}

/* ---------- Inicio ---------- */
function home(){
  const l=mine(),t=today(),days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return[ymd(d),['D','L','M','M','J','V','S'][d.getDay()]]});
  const cnt=days.map(([d])=>l.filter(r=>r.fecha===d).length),mx=Math.max(1,...cnt);
  const hoy=l.filter(r=>r.fecha===t).length,sem=cnt.reduce((a,b)=>a+b,0);
  const tec=cuentas.filter(c=>c.rol==='tecnico'&&c.estado==='activo').length,pen=cuentas.filter(c=>c.estado==='pendiente').length;
  const h=new Date().getHours(),sal=h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches';
  let s=`<div class="hero"><div><h2>${sal}, ${esc(ses.nombre.split(' ')[0])}</h2><p>${adm()?'Panel de administración de reportes':'Registra tus visitas técnicas del día'}</p></div><button class="btn" data-go="new">${ic('plus')}Nuevo reporte</button></div>`;
  s+=`<div class="stats"><div class="st"><b>${l.length}</b><span>${adm()?'Reportes totales':'Mis reportes'}</span></div><div class="st"><b>${hoy}</b><span>Hoy</span></div><div class="st"><b>${sem}</b><span>Últimos 7 días</span></div>`;
  if(adm())s+=`<div class="st"><b>${tec}</b><span>Técnicos activos${pen?' · '+pen+' pendientes':''}</span></div>`;
  s+=`</div><div class="card"><h3>Actividad semanal</h3><div class="bars">${days.map(([d,n],i)=>`<div><i style="height:${cnt[i]/mx*85}%" title="${cnt[i]}"></i>${cnt[i]||''}<br>${n}</div>`).join('')}</div></div>`;
  s+=`<div class="card"><h3>Últimos reportes</h3>${l.slice(0,4).map(r=>`<p style="margin:6px 0"><b>${esc(r.sitio)}</b> · <span style="color:var(--mut)">${esc(r.fecha)} · ${esc(r.createdByName||r.tecnico||'')}</span></p>`).join('')||'<div class="empty">Aún no hay reportes.</div>'}</div>`;
  return s;
}

/* ---------- Formulario ---------- */
function tileH(k,l,i,o={}){
  const v=pend[k],na=v==='NA',has=v&&!na;
  return `<div class="tw"><label class="tile${has?' ok':''}${na?' na':''}" id="tl_${k}"><input type="file" accept="image/*" data-k="${k}" hidden><div class="ti">${ic(i)}</div><b>${l}${o.req?' <i style="color:#ff8a60;font-style:normal">*</i>':''}</b><span id="s_${k}">${has?'Toca para cambiar':'Toca para subir foto'}</span><div class="nabig">N/A</div><img alt=""${has?` src="/_blob/${v}"`:''}></label>${o.na?`<label class="nab"><input type="checkbox" data-na="${k}"${na?' checked':''}> N/A · No aplica</label>`:''}${o.rm!==undefined?`<button type="button" class="rmx" data-rm="${o.rm}" title="Quitar">×</button>`:''}</div>`;
}
function exH(){
  let h='';for(let j=0;j<exN;j++)h+=tileH('x'+j,'Foto adicional '+(j+1),'camera',{rm:j});
  if(exN<4)h+=`<button type="button" class="tile addx" id="addx"><div class="ti">+</div><b>Agregar más fotos</b><span>Opcional · ${exN}/4 adicionales</span></button>`;
  $('#exs').innerHTML=h;bind($('#exs'));
}
function bind(root){
  root.querySelectorAll('input[type=file]').forEach(i=>i.onchange=()=>upImg(i));
  root.querySelectorAll('[data-na]').forEach(c=>c.onchange=()=>setNA(c.dataset.na,c.checked));
  root.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const j=+b.dataset.rm;for(let i=j;i<exN-1;i++)pend['x'+i]=pend['x'+(i+1)];delete pend['x'+(exN-1)];exN--;exH()});
  const a=root.querySelector('#addx');if(a)a.onclick=()=>{pend['x'+exN]='';exN++;exH()};
}
function setNA(k,on){pend[k]=on?'NA':'';const t=$('#tl_'+k);t.classList.toggle('na',on);t.classList.remove('ok');$('#s_'+k).textContent=on?'No aplica':'Toca para subir foto'}
function buildForm(r){
  r=r||{};editing=r.id||null;pend={};gacc=r.precision||'';
  for(const [k] of IMG)pend[k]=r[k]||'';
  pend.act1=r.act1||'';pend.act2=r.act2||'';exN=0;(r.extras||[]).slice(0,4).forEach((v,j)=>{pend['x'+j]=v;exN++});
  let h=`<div class="card"><h3>${editing?'Editar reporte':'Nueva visita técnica'}</h3><div class="sec">Datos del sitio</div><div class="grid">`;
  h+=`<div><label class="l">Fecha de Registro <i>*</i></label><input type="date" id="f_fecha" value="${esc(r.fecha||today())}"></div>`;
  for(const [k,l,req] of TXT){const v=r[k]||(k==='tecnico'?ses.nombre:'');h+=`<div><label class="l">${l}${req?' <i>*</i>':''}</label><input type="text" id="f_${k}" value="${esc(v)}" autocomplete="off"></div>`}
  h+=`<div><label class="l">Coordenadas GPS (lat, lng)</label><input type="text" id="f_coords" inputmode="decimal" placeholder="4.710989, -74.072092" value="${esc(r.coords||'')}"><button type="button" class="btn n w" id="gps" style="margin-top:6px">${ic('pin')}Capturar mi ubicación</button><div class="gs" id="gst">${r.precision?'Precisión guardada: ±'+esc(r.precision)+' m':'GPS del dispositivo o Google Maps'}</div><div class="fb" id="gfb"><div class="row"><a id="gmo" class="btn s" style="flex:1" href="https://www.google.com/maps" target="_blank" rel="noopener">Abrir Google Maps</a><button type="button" class="btn s" id="gpa" style="flex:1">Pegar coordenadas</button></div><span>En Maps mantén presionado el punto, copia las coordenadas y vuelve aquí: se pegan solas.</span></div><a id="gml" class="btn s w" target="_blank" rel="noopener" hidden style="margin-top:6px">Ver en Google Maps</a></div>`;
  h+=`<div style="grid-column:1/-1"><label class="l">Nota de Tipo de Acceso</label><textarea id="f_acceso">${esc(r.acceso||'')}</textarea></div></div>`;
  h+=`<div class="sec">Fotos del sitio</div><div class="tiles">${IMG.map(([k,l,i],n)=>tileH(k,l,i,{req:1,na:n<2})).join('')}</div>`;
  h+=`<div class="sec">Actividad a Realizar${editing?'':' <i style="color:var(--bad);font-style:normal">*</i>'}</div><textarea id="f_actividad" placeholder="Describe la actividad que se va a realizar en el sitio">${esc(r.actividad||'')}</textarea>`;
  h+=`<div class="sec">Fotos de Actividad</div><div class="tiles">${tileH('act1','Fotos de Actividad 1','camera',{req:!editing})}${tileH('act2','Fotos de Actividad 2','camera',{req:!editing})}</div><div class="tiles" id="exs" style="margin-top:12px"></div>`;
  h+=`<div class="row" style="margin-top:18px"><button class="btn" id="save">${ic('chk')}${editing?'Guardar cambios':'Guardar reporte'}</button>${editing?'<button class="btn s" id="cancel">Cancelar</button>':''}</div></div>`;
  $('#mn').innerHTML=h;exH();bind($('#mn'));
  $('#gps').onclick=gps;$('#save').onclick=save;$('#gpa').onclick=()=>pasteC(false);$('#gmo').onclick=()=>{gmOpen=true};
  const fc=$('#f_coords');fc.onchange=()=>{const c=parseCoords(fc.value);if(c){fc.value=c;gacc=''}updMap()};
  fc.onpaste=()=>setTimeout(()=>{const c=parseCoords(fc.value);if(c){fc.value=c;gacc='';updMap();toast('Coordenadas detectadas')}else toast('No encontré coordenadas. Copia las coordenadas desde Google Maps.')},0);
  updMap();
  if(editing)$('#cancel').onclick=()=>go('list');
}
const mapUrl=c=>'https://www.google.com/maps?q='+encodeURIComponent(String(c).replace(/\s+/g,''));
function parseCoords(s){try{s=decodeURIComponent(String(s||''))}catch(e){s=String(s||'')}
  for(const re of [/@(-?\d{1,3}\.\d+),\s*(-?\d{1,3}\.\d+)/,/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,/[?&](?:q|ll|query|destination)=\s*(-?\d{1,3}\.\d+)[,\s]+(-?\d{1,3}\.\d+)/,/(-?\d{1,3}\.\d+)\s*[,;\s]\s*(-?\d{1,3}\.\d+)/]){
    const m=s.match(re);if(m){const a=+m[1],b=+m[2];if(Math.abs(a)<=90&&Math.abs(b)<=180)return a.toFixed(6)+', '+b.toFixed(6)}}return null}
function updMap(){const a=$('#gml');if(!a)return;const c=parseCoords($('#f_coords').value);a.hidden=!c;if(c)a.href=mapUrl(c)}
async function pasteC(auto){
  try{const t=await navigator.clipboard.readText(),c=parseCoords(t);
    if(c){$('#f_coords').value=c;gacc='';gmOpen=false;updMap();$('#gst').textContent='✓ Coordenadas tomadas de Google Maps. Se guardarán con el reporte.';toast('Coordenadas capturadas de Google Maps');return true}
    if(!auto)toast('No hay coordenadas copiadas. Cópialas en Google Maps primero.')}
  catch(e){if(!auto)toast('Sin acceso al portapapeles: pega las coordenadas en el campo')}
  return false}
window.addEventListener('focus',()=>{if(gmOpen&&view==='new'&&$('#gpa'))pasteC(true)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&gmOpen&&view==='new'&&$('#gpa'))pasteC(true)});
function gps(){
  const b=$('#gps'),st=$('#gst');
  const fail=m=>{b.disabled=false;st.textContent=m;$('#gfb').hidden=false};
  if(!navigator.geolocation)return fail('Este navegador no da acceso al GPS aquí. Usa Google Maps:');
  b.disabled=true;st.textContent='Buscando señal GPS…';let best=null,id,t,fin=false;
  const stop=()=>{fin=true;try{navigator.geolocation.clearWatch(id)}catch(e){}clearTimeout(t)};
  const done=()=>{if(fin)return;stop();if(!best)return fail('No se obtuvo señal GPS. Usa Google Maps:');
    const c=best.coords;$('#f_coords').value=c.latitude.toFixed(6)+', '+c.longitude.toFixed(6);gacc=Math.round(c.accuracy);b.disabled=false;
    st.textContent='✓ Ubicación fijada (precisión ±'+gacc+' m). Se guardará con el reporte.';updMap();toast('Coordenadas capturadas')};
  try{id=navigator.geolocation.watchPosition(p=>{if(!best||p.coords.accuracy<best.coords.accuracy)best=p;st.textContent='Afinando precisión… ±'+Math.round(best.coords.accuracy)+' m';if(best.coords.accuracy<=10)done()},
    e=>{if(fin)return;if(best)return done();stop();fail(e.code===1?'El navegador bloqueó la ubicación. Usa Google Maps:':'No se pudo leer el GPS. Usa Google Maps:')},
    {enableHighAccuracy:true,maximumAge:0,timeout:20000})}catch(e){return fail('No se pudo usar el GPS. Usa Google Maps:')}
  t=setTimeout(done,12000);
}
function shrink(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?ok(b):no()},'image/jpeg',.72)};im.onerror=no;im.src=u})}
async function upImg(inp){
  const k=inp.dataset.k,f=inp.files[0];if(!f)return;
  if(!assets){toast('La subida de imágenes no está disponible en esta sesión');return}
  const s=$('#s_'+k);s.textContent='Subiendo…';busy++;$('#save').disabled=true;
  try{const b=await shrink(f),r=await assets.upload(b);pend[k]=r.id;const t=$('#tl_'+k);t.querySelector('img').src=URL.createObjectURL(b);t.classList.remove('na');t.classList.add('ok');
    const cb=document.querySelector('[data-na="'+k+'"]');if(cb)cb.checked=false;s.textContent='Listo ✓ Toca para cambiar'}
  catch(e){s.textContent='Error al subir. Intenta de nuevo.';pend[k]=''}
  busy--;if(!busy)$('#save').disabled=false;
}
async function save(){
  const d={fecha:$('#f_fecha').value,acceso:$('#f_acceso').value.trim(),coords:$('#f_coords').value.trim(),precision:String(gacc||''),actividad:$('#f_actividad').value.trim()};
  for(const [k] of TXT)d[k]=$('#f_'+k).value.trim();
  if(!d.fecha||!d.sitio)return toast('Completa fecha y nombre del sitio');
  for(const [k,l,i] of IMG){if(!pend[k])return toast('Falta: '+l+(IMG.findIndex(x=>x[0]===k)<2?' (o márcala como N/A)':''));d[k]=pend[k]}
  if(!editing){if(!d.actividad)return toast('Escribe la Actividad a Realizar');if(!pend.act1)return toast('Falta: Fotos de Actividad 1');if(!pend.act2)return toast('Falta: Fotos de Actividad 2')}
  d.act1=pend.act1||'';d.act2=pend.act2||'';d.extras=[...Array(exN)].map((_,j)=>pend['x'+j]).filter(v=>v&&v!=='NA');
  $('#save').disabled=true;
  try{const now=Date.now();
    if(editing){const o={...rows.find(x=>x.id==editing)};delete o.id;await db.collection('visitas').doc(editing).set({...o,...d,updatedAt:now})}
    else await db.collection('visitas').add({...d,createdBy:ses.user,createdByName:ses.nombre,createdAt:now,updatedAt:now});
    toast(editing?'Cambios guardados':'Reporte guardado');go('list');
  }catch(e){toast('No se pudo guardar: '+(e.code||'error'));$('#save').disabled=false}
}

/* ---------- Registros ---------- */
function listH(){
  let l=mine();if(q){const t=q.toLowerCase();l=l.filter(r=>[r.sitio,r.operador,r.tecnico,r.fecha].join(' ').toLowerCase().includes(t))}
  let h=`<div class="card row"><input type="text" id="q" placeholder="Buscar sitio, operador, técnico o fecha" value="${esc(q)}" style="flex:1;min-width:200px">${adm()?'<button class="btn s" id="csv">Exportar CSV</button>':''}</div>`;
  if(!adm())h+='<p style="color:var(--mut);font-size:13px;margin:0 0 10px">Aquí ves solo los reportes que tú subiste.</p>';
  if(!l.length)h+='<div class="empty">No hay reportes para mostrar.</div>';
  for(const r of l){
    h+=`<div class="card rec"><div><h3>${esc(r.sitio)}</h3><p>${esc(r.fecha)} · ${esc(r.operador||'Sin operador')} · Técnico: ${esc(r.tecnico||'-')}</p>${r.coords?`<p>GPS: <a href="${mapUrl(r.coords)}" target="_blank" rel="noopener" style="color:var(--or);font-weight:600">${esc(r.coords)} · Ver en Maps</a></p>`:''}<p>${esc(r.acceso||'')}</p>${r.actividad?`<p><b>Actividad:</b> ${esc(r.actividad.slice(0,140))}</p>`:''}<div class="th">${[...IMG.map(x=>r[x[0]]),r.act1,r.act2,...(r.extras||[])].filter(v=>v&&v!=='NA').map(v=>`<img src="/_blob/${v}" alt="">`).join('')}</div></div>`;
    if(adm())h+=`<div class="acts"><button class="btn" data-a="pdf" data-id="${r.id}">Descargar PDF</button><button class="btn s" data-a="ed" data-id="${r.id}">Editar</button><button class="btn d" data-a="del" data-id="${r.id}">Eliminar</button></div>`;
    h+='</div>';
  }
  return h;
}
async function act(a,id,btn){
  if(!adm())return;
  const r=rows.find(x=>x.id==id);
  if(a==='ed'&&r)go('new',r);
  if(a==='del'&&r){if(!await ask('¿Eliminar el reporte de "'+r.sitio+'"? No se puede deshacer.',{ok:'Eliminar',danger:1}))return;
    try{await db.collection('visitas').doc(id).delete();rows=rows.filter(x=>x.id!==id);paint();toast('Reporte eliminado')}catch(e){toast('No se pudo eliminar: '+(e.code||e.message||'error'))}}
  if(a==='pdf'&&r){btn.disabled=true;btn.textContent='Generando…';try{await pdf(r)}catch(e){toast('Error al generar el PDF')}btn.disabled=false;btn.textContent='Descargar PDF'}
  if(a==='ok')await upCuenta(id,{estado:'activo'});
  if(a==='off'){if(id===ses.user)return toast('No puedes desactivarte a ti mismo');await upCuenta(id,{estado:'inactivo'})}
  if(a==='pw'){const p=await ask('Nueva contraseña para '+id+' (mínimo 6 caracteres)',{input:1,ok:'Cambiar'});if(p===null)return;if(p.length<6)return toast('Muy corta');const sl=salt();await upCuenta(id,{salt:sl,hash:await sha(sl+p)});toast('Contraseña actualizada')}
  if(a==='rm'){if(id===ses.user)return toast('No puedes eliminarte a ti mismo');if(!await ask('¿Eliminar la cuenta "'+id+'"?',{ok:'Eliminar',danger:1}))return;try{await db.collection('cuentas').doc(id).delete();toast('Cuenta eliminada')}catch(e){toast('No se pudo eliminar: '+(e.code||'error'))}}
}

/* ---------- Usuarios (admin) ---------- */
const upCuenta=async(id,p)=>{try{const o={...cuentas.find(c=>c.id===id)};delete o.id;await db.collection('cuentas').doc(id).set({...o,...p})}catch(e){toast('No se pudo actualizar')}};
function setRol(id,rol){if(id===ses.user&&rol!=='admin'&&cuentas.filter(c=>c.rol==='admin'&&c.estado==='activo').length<2){toast('Debe quedar al menos un administrador');paint();return}upCuenta(id,{rol})}
function usersH(){
  let h='<div class="card"><h3>Cuentas</h3><p style="color:var(--mut);margin:0;font-size:13px">Aprueba las cuentas nuevas y asigna el rol: administrador o técnico.</p></div>';
  for(const c of [...cuentas].sort((a,b)=>(a.estado==='pendiente'?0:1)-(b.estado==='pendiente'?0:1))){

  }
  return h;
}

/* ---------- PDF y CSV ---------- */
function loadImg(id){return new Promise(ok=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);ok({d:c.toDataURL('image/jpeg',.85),w:im.width,h:im.height})};im.onerror=()=>ok(null);im.src='/_blob/'+id})}
async function pdf(r){
  if(!window.jspdf)return toast('El generador de PDF no cargó. Revisa tu conexión.');
  const d=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),NV=[18,41,75],OR=[228,87,27],GR=[241,245,250],H='helvetica',CH=6.5;
  const cut=(s,w)=>{s=String(s||'-').replace(/\s+/g,' ');if(d.getTextWidth(s)<=w)return s;while(s.length>1&&d.getTextWidth(s+'...')>w)s=s.slice(0,-1);return s+'...'};
  const head=sub=>{d.setFillColor(...NV);d.rect(0,0,210,30,'F');d.setFillColor(...OR);d.rect(0,30,210,1.8,'F');
    d.setFillColor(255,255,255);d.roundedRect(10,5,44,20,2.5,2.5,'F');try{d.addImage(LOGO,'PNG',12,6.3,40,18.5)}catch(e){}
    d.setTextColor(255);d.setFont(H,'normal');d.setFontSize(8.5);d.text(sub,62,11);d.setFont(H,'bold');d.setFontSize(17);d.text(cut(r.sitio,138),62,21);
    d.setFont(H,'normal');d.setFontSize(8.5);d.text(r.fecha,200,11,{align:'right'})};
  const foot=p=>{d.setFillColor(...NV);d.rect(0,287,210,10,'F');d.setFont(H,'normal');d.setFontSize(8);d.setTextColor(255);
    d.text('E&S Engineering & Services  |  FieldOps',10,293);d.text('Página '+p+' de 2   |   '+new Date().toLocaleString('es-CO'),200,293,{align:'right'})};
  const sec=(y,t)=>{d.setFillColor(...OR);d.rect(10,y,3,5,'F');d.setFont(H,'bold');d.setFontSize(11);d.setTextColor(...NV);d.text(t,16,y+4);d.setDrawColor(...OR);d.setLineWidth(.4);d.line(10,y+6,200,y+6)};
  const photo=async(x,y,W,BH,l,v)=>{
    d.setFillColor(...NV);d.rect(x,y,W,CH,'F');d.setFillColor(...OR);d.rect(x,y,2,CH,'F');d.setFont(H,'bold');d.setFontSize(8.5);d.setTextColor(255);d.text(cut(l,W-8),x+5,y+4.5);
    if(v==='NA'){d.setFillColor(255,243,236);d.rect(x,y+CH,W,BH,'F');d.setDrawColor(...OR);d.setLineWidth(.6);d.setLineDashPattern([2.5,1.8],0);d.rect(x+1.5,y+CH+1.5,W-3,BH-3,'S');d.setLineDashPattern([],0);
      d.setFont(H,'bold');d.setFontSize(40);d.setTextColor(...OR);d.text('N/A',x+W/2,y+CH+BH/2+3,{align:'center'});
      d.setFontSize(8);d.setTextColor(...NV);d.text('NO APLICA PARA ESTE SITIO',x+W/2,y+CH+BH/2+12,{align:'center'});return}
    d.setFillColor(...GR);d.rect(x,y+CH,W,BH,'F');
    const im=v?await loadImg(v):null;
    if(im){const sc=Math.min((W-2)/im.w,(BH-2)/im.h),w=im.w*sc,h=im.h*sc;d.addImage(im.d,'JPEG',x+(W-w)/2,y+CH+(BH-h)/2,w,h)}
    else{d.setFont(H,'normal');d.setFontSize(9);d.setTextColor(120);d.text('(sin imagen)',x+W/2,y+CH+BH/2,{align:'center'})}
    d.setDrawColor(207,220,236);d.setLineWidth(.3);d.rect(x,y+CH,W,BH,'S')};
  /* Página 1: datos y fotos del sitio */
  head('REPORTE DE VISITA TÉCNICA');
  const co=parseCoords(r.coords);
  const F=[['Fecha de registro',r.fecha],['Nombre del sitio',r.sitio],['Operador',r.operador],['Técnico',r.tecnico],['Dirección de llaves/custodio',r.llaves],['Contacto de seguridad NOC',r.segAI],['Inge encargado/contacto',r.ingeniero],['Coordenadas GPS',r.coords?r.coords+(r.precision?'  (±'+r.precision+' m)':''):'']];
  F.forEach(([l,v],i)=>{const x=10+(i%2)*97,y=38+Math.floor(i/2)*17;
    d.setFillColor(...GR);d.roundedRect(x,y,93,14.5,2,2,'F');d.setFillColor(...OR);d.rect(x,y+1.8,1.2,10.9,'F');
    d.setFont(H,'normal');d.setFontSize(7.5);d.setTextColor(95,113,134);d.text(l,x+4,y+4.8);
    d.setFont(H,'bold');d.setFontSize(10);d.setTextColor(18,38,58);d.text(cut(v,86),x+4,y+10.8)});
  if(co){d.setFont(H,'bold');d.setFontSize(7.5);d.setTextColor(...OR);d.textWithLink('Abrir en Google Maps',107+89,38+3*17+4.8,{url:mapUrl(co),align:'right'})}
  d.setFillColor(...GR);d.roundedRect(10,106,190,22,2,2,'F');d.setFillColor(...OR);d.rect(10,107.8,1.2,18.4,'F');
  d.setFont(H,'normal');d.setFontSize(7.5);d.setTextColor(95,113,134);d.text('Nota de tipo de acceso',14,110.8);
  d.setFontSize(9);d.setTextColor(18,38,58);
  let L=d.splitTextToSize(String(r.acceso||'Sin nota'),182);if(L.length>3){L=L.slice(0,3);L[2]=cut(L[2]+' ...',182)}
  L.forEach((t,i)=>d.text(t,14,116.2+i*4.2));
  sec(134,'REGISTRO FOTOGRÁFICO DEL SITIO');
  let i=0;for(const [k,l] of IMG){await photo(10+(i%2)*97,144+Math.floor(i/2)*67.5,93,56,l,r[k]);i++}
  foot(1);
  /* Página 2: actividad */
  d.addPage();head('ACTIVIDAD A REALIZAR Y EVIDENCIAS');
  sec(38,'ACTIVIDAD A REALIZAR');
  d.setFont(H,'normal');d.setFontSize(9.5);
  let A=d.splitTextToSize(String(r.actividad||'Sin descripción registrada'),182);if(A.length>8){A=A.slice(0,8);A[7]=cut(A[7]+' ...',182)}
  const ah=8+A.length*4.6;
  d.setFillColor(...GR);d.roundedRect(10,47,190,ah,2,2,'F');d.setFillColor(...OR);d.rect(10,48.8,1.2,ah-3.6,'F');
  d.setTextColor(18,38,58);A.forEach((t,j)=>d.text(t,14,53.2+j*4.6));
  const ex=(r.extras||[]).filter(v=>v&&v!=='NA'),n=ex.length;
  let y=47+ah+7;sec(y,'FOTOS DE ACTIVIDAD');y+=10;
  const BA=n?54:80;
  await photo(10,y,93,BA,'Fotos de Actividad 1',r.act1);await photo(107,y,93,BA,'Fotos de Actividad 2',r.act2);
  if(n){y+=CH+BA+8;sec(y,'FOTOS ADICIONALES');y+=10;
    const rows=Math.ceil(n/2),BE=Math.min(56,Math.floor((283-y-rows*(CH+4))/rows));
    for(let j=0;j<n;j++)await photo(10+(j%2)*97,y+Math.floor(j/2)*(CH+BE+4),93,BE,'Foto adicional '+(j+1),ex[j])}
  foot(2);
  if(!dl)return toast('La descarga no está disponible en esta vista');
  try{await dl.save({filename:r.fecha.replace(/-/g,'')+'_'+r.sitio.replace(/[^\w\-]+/g,'_')+'.pdf',data:d.output('blob')});toast('PDF listo')}catch(e){if(e.code!=='declined')toast('No se pudo guardar el PDF')}
}
async function csv(){
  const cols=['fecha',...TXT.map(t=>t[0]),'coords','precision','acceso','actividad'];
  const L=[cols.join(',')].concat(rows.map(r=>cols.map(c=>'"'+String(r[c]||'').replace(/"/g,'""')+'"').join(',')));
  if(dl)try{await dl.save({filename:'visitas_'+today()+'.csv',data:'\ufeff'+L.join('\n')})}catch(e){}
}

/* ---------- Arranque ---------- */
$('#bo').onclick=()=>enter('owner-'+ownerId,{nombre:ownerName,rol:'admin'});
(async()=>{
  try{
    const c=window.claude;if(!c)return am('Abre esta página desde claude.ai');
    [db,assets,dl,user]=await Promise.all([c.use('db'),c.use('assets'),c.use('downloads'),c.use('user')]);
    if(!db)return am('Sin sesión de Claude: inicia sesión para usar la app.');
    if(user){try{ownerAdmin=await user.canEdit();if(ownerAdmin){ownerId=(await user.id())||'x';try{const m=await user.me();ownerName=m.name||m.email||'Administrador'}catch(e){}}}catch(e){}}
    if(ownerAdmin){$('#bo').hidden=false;return $('#bo').click()}
    let u='';try{u=localStorage.getItem('fo_ses')||''}catch(e){}
    if(u){const s=await db.collection('cuentas').doc(u).get();if(s.exists&&s.data().estado==='activo')enter(u,s.data())}
  }catch(e){am('Error al iniciar la app')}
})();
